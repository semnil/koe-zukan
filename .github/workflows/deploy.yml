name: Deploy to GitHub Pages

# The build job runs the tests, builds the site and uploads it as the Pages artifact on every pull request, every push
# to master and every manual run; the deploy job deploys it on a push or a manual run and is skipped on a pull request.
# The build job's token can only read the repository. Each pull request has its own concurrency group, apart from the
# `pages` group of the deploys. `build` is a required status check of master.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 35
        run: |
          pip install openpyxl Pillow
          sudo apt-get install -y fonts-noto-cjk

      - name: Run tests
        timeout-minutes: 10
        run: |
          pip install pytest
          python -m pytest tests/test_build.py -v
          node --test tests/test_frontend.mjs

      - name: Build site
        run: python scripts/build.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
