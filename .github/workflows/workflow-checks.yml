name: Workflow checks

# Runs on every pull request with this file as it is on the base branch (pull_request_target),
# so a pull request cannot change the check that judges it. The pull request's files are only read and
# parsed with yq; nothing from the pull request is executed, and the token is read-only.
# Every jobs.<id>.uses / jobs.<id>.steps[*].uses in .github/workflows/ and runs.steps[*].uses in tracked
# action.yml / action.yaml files must be a 40-character commit SHA with a # vX.Y.Z comment on the same line
# (local ./ references are exempt).
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check that every uses is pinned to a commit SHA
        shell: bash
        run: |
          shopt -s nullglob
          workflows=(.github/workflows/*.yml .github/workflows/*.yaml)
          git ls-files -z -- 'action.yml' 'action.yaml' '*/action.yml' '*/action.yaml' > "$RUNNER_TEMP/actions.lst"
          actions=()
          while IFS= read -r -d '' f; do actions+=("$f"); done < "$RUNNER_TEMP/actions.lst"
          workflow_uses='(.jobs[] | select(has("uses")) | .uses), (.jobs[].steps[]? | select(has("uses")) | .uses)'
          action_uses='(.runs.steps[]? | select(has("uses")) | .uses)'
          unpinned='select((test("^[.]/") | not) and ((test("^[^@[:space:]]+@[0-9a-f]{40}$") and (line_comment | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))) | not)) | filename + ":" + (line | tostring) + ": " + . + "  # " + line_comment'
          yq --version
          total=0
          : > "$RUNNER_TEMP/unpinned.txt"
          check() {
            local query="$1" file="$2" n
            n=$(yq "[${query}] | length" "$file")
            total=$((total + n))
            yq "(${query}) | ${unpinned}" "$file" >> "$RUNNER_TEMP/unpinned.txt"
          }
          for f in "${workflows[@]}"; do check "$workflow_uses" "$f"; done
          for f in "${actions[@]}"; do check "$action_uses" "$f"; done
          echo "Checked ${total} uses entries in ${#workflows[@]} workflow files and ${#actions[@]} action files"
          if [ "$total" -eq 0 ]; then
            echo "::error::No uses entries found"
            exit 1
          fi
          if [ -s "$RUNNER_TEMP/unpinned.txt" ]; then
            echo "::error::uses must be @<40-char commit SHA> with a # vX.Y.Z comment on the same line"
            cat "$RUNNER_TEMP/unpinned.txt"
            exit 1
          fi
