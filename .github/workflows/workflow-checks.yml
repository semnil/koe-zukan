name: Workflow checks

# Runs on every pull request with this file as it is on the base branch (pull_request_target),
# so a pull request cannot change the check that judges it. The pull request's files are only read and
# parsed with yq; nothing from the pull request is executed, and the token is read-only.
# Every jobs.<id>.uses / jobs.<id>.steps[*].uses in .github/workflows/ and runs.steps[*].uses in tracked
# action.yml / action.yaml files must be a 40-character commit SHA with a # vX.Y.Z comment on the same line
# (local ./ references are exempt).
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check that every uses is pinned to a commit SHA
        shell: bash
        run: exit 0
